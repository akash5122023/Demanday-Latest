server {
    listen 80;
    server_name {{subdomain}}.bizpluserp.com;

    # Allow large Excel imports (Verify Sheets, etc.). Must match the app's
    # RequestSizeLimit (500 MB); the nginx default of 1 MB otherwise returns
    # "413 Request Entity Too Large" before the request reaches the app.
    client_max_body_size 500M;

    location / {
        proxy_pass http://localhost:{{port}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
