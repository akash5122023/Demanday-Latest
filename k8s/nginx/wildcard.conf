map $host $tenant_port {
    default 0;
    include /etc/nginx/conf.d/tenants.map;
}

server {
    listen 80;
    server_name *.example.com;

    # Allow large Excel imports (Verify Sheets, etc.). Must match the app's
    # RequestSizeLimit (500 MB); the nginx default of 1 MB otherwise returns
    # "413 Request Entity Too Large" before the request reaches the app.
    client_max_body_size 500M;

    location / {
        if ($tenant_port = 0) {
            return 404;
        }
        proxy_pass http://127.0.0.1:$tenant_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
